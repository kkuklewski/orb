<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="build" content="__BUILD__">
<title>Orb</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orb">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g'%3E%3Cstop offset='0' stop-color='%23d946ef'/%3E%3Cstop offset='1' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='url(%23g)' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link id="hljs-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/styles/github-dark.min.css" integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH" crossorigin="anonymous">
<link id="hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/styles/github.min.css" integrity="sha384-eFTL69TLRZTkNfYZOLM+G04821K1qZao/4QLJbet1pP4tcF+fdXq/9CdqAbWRl/L" crossorigin="anonymous" disabled>
<link rel="stylesheet" href="/static/app.css?v=__BUILD__">
<link rel="stylesheet" href="/static/kos.css?v=__BUILD__">
<script src="https://cdn.jsdelivr.net/npm/marked@18.1.0/lib/marked.umd.js" integrity="sha384-IvVdUXkhyoD0shbjhiiOnuiTbervTaB0VJcnEcg3shUAMVOOF6lKj4ozJrCwvz6s" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js" integrity="sha384-a7SzOxErzJ3ZpQz0zJ32d67dSitNzPcbfybc/ykU9KJhMgZkwqfSxlhhdJRS+XGL" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/highlight.min.js" integrity="sha384-wjfDDhOPPdjtva8vWBhWeVprSpmxisEu5aYT3q1JyACqXpdKpo3PWZTMVq24MBix" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.wasm.min.js" integrity="sha384-Bw6URI+Gvoadw0do7/QrSHUC9D1vCYYK5OSqChFyhyV5mzPL4oe2rOAFljAnS8Sq" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.31/dist/bundle.min.js" integrity="sha384-BLK6Iw3Zbz9hHmHYBgWHJ8GaGVHf3hfnz95vXOla64ZQHHL/T7r9PeIl6jUx8eer" crossorigin="anonymous"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigation">
    <div class="side-head">
      <button class="icon-btn ghost" id="collapse-side" title="Collapse sidebar" aria-label="Collapse sidebar"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
      <div class="brand">Orb</div>
      <button class="icon-btn ghost only-narrow" id="close-side" aria-label="Close">✕</button>
    </div>
    <label class="search"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false"></label>
    <div class="search-results" id="search-results" hidden></div>
    <nav class="side-nav">
      <button class="nav-item" id="nav-new"><span class="nav-ic"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></span>New</button>
      <button class="nav-item" id="nav-brain" hidden><span class="nav-ic"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V6a2 2 0 0 0-3-2Z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/></svg></span>Brain</button>
      <button class="nav-item" id="nav-activity"><span class="nav-ic"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg></span>Activity<span class="nav-badge" id="activity-badge" hidden></span></button>
      <button class="nav-item" id="nav-routines" hidden><span class="nav-ic"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg></span>Routines<span class="nav-badge" id="routines-badge" hidden></span></button>
      <button class="nav-item" id="nav-settings"><span class="nav-ic"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></span>Settings</button>
    </nav>
    <div class="side-scroll">
      <section class="side-section">
        <div class="sec-head"><span>Repos</span><button class="icon-btn ghost sm" id="pin-add" title="Pin a repo" aria-label="Pin a repo"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <div id="projects"></div>
      </section>
      <section class="side-section">
        <div class="sec-head"><span>Recents</span><button class="icon-btn ghost sm" id="recent-add" title="New session" aria-label="New session"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <div id="recents"></div>
      </section>
    </div>
    <div class="side-foot">
      <span class="avatar" id="who-avatar">·</span><span class="who"><span id="who-name">Claude</span> <span class="plan" id="who-plan"></span></span>
      <span class="svc-dots" id="services"></span>
      <button class="icon-btn ghost" id="foot-settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
    </div>
  </aside>
  <div class="scrim only-narrow" id="scrim"></div>

  <main class="main">
    <header class="top">
      <button class="icon-btn open-side" id="open-side" aria-label="Open sidebar"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3V6Zm0 5h18v2H3v-2Zm0 5h18v2H3v-2Z"/></svg></button>
      <div class="where">
        <div class="where-name" id="where-name">Pick a folder</div>
        <div class="where-meta mono" id="where-meta"></div>
      </div>
      <div class="top-tools">
        <div class="sysline" id="sysline" title="Connection to the dashboard server"><span class="on"></span><span id="sys-text">system online</span><span id="sys-clock"></span></div>
        <div class="usage mono" id="usage" title="Max plan usage" hidden></div>
        <div class="ctx mono" id="ctx" hidden></div>
        <button class="chip-btn mono mcp-chip" id="mcp" hidden title="MCP servers">MCP</button>
        <button class="chip-btn mono mode-chip model-chip" id="model" hidden>model: sonnet</button>
        <button class="chip-btn mono mode-chip" id="mode" hidden>approvals: default</button>
        <button class="chip-btn" id="new-session" title="Start a fresh session in this folder">New session</button>
        <button class="icon-btn" id="mute" aria-pressed="false" title="Mute speech (M)" aria-label="Mute speech"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3Zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4ZM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6Z"/></svg><span class="slash" aria-hidden="true"></span></button>
      </div>
    </header>

    <div class="mcp-panel" id="mcp-panel" hidden></div>
    <section class="chat" id="chat" aria-live="polite">
      <div class="column" id="column"></div>
      <div class="hero" id="hero">
        <div class="hero-orb-slot" id="hero-slot"></div>
        <p class="hero-hint" id="hero-hint">Tap the orb to talk</p>
        <p class="hero-sub mono" id="hero-sub">or type below · Space toggles the mic · Esc stops</p>
      </div>
    </section>
    <section class="view" id="activity-view" hidden>
      <div class="view-col">
        <div class="view-head"><h2>Activity</h2><span class="mono view-sub">sessions working, waiting for you or done</span></div>
        <div id="activity-list"></div>
      </div>
    </section>
    <section class="view" id="routines-view" hidden>
      <div class="view-col">
        <div class="view-head"><h2>Routines</h2><span class="mono view-sub" id="routines-sub">scheduled cloud agents</span>
          <button class="chip-btn" id="routines-refresh">Check now</button></div>
        <div id="routines-list"></div>
      </div>
    </section>
    <section class="view" id="setup-view" hidden>
      <div class="view-col" id="setup-body"></div>
    </section>
    <section class="view" id="settings-view" hidden>
      <div class="view-col" id="settings-body"></div>
    </section>
    <button class="to-bottom" id="to-bottom" aria-label="Scroll to latest" hidden>↓</button>
    <div class="brain-bar" id="brain-bar" hidden>
      <button class="chip-btn" data-ask="Co nowego w mózgu?">What's new</button>
      <button class="chip-btn" data-ask="What did the AI curate last night?">Night report</button>
      <button class="chip-btn" id="dictate-note">Dictate a note</button>
    </div>

    <footer class="dock">
      <div class="dock-state mono"><span class="state-dot" id="state-dot"></span><span id="state-label">Idle</span><span class="barge mono" id="barge"></span></div>
      <div class="dock-row">
        <div class="orb-slot" id="dock-slot">
          <button class="orb" id="orb" aria-label="Talk" aria-pressed="false">
            <canvas id="orb-canvas"></canvas>
            <span class="orb-mic" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-2.07A7 7 0 0 0 19 12h-2Z"/></svg></span>
          </button>
        </div>
        <form class="composer" id="composer">
          <div class="slash-menu" id="slash-menu" role="listbox" aria-label="Slash commands" hidden></div>
          <textarea id="input" rows="1" placeholder="Type to Claude… ( / for commands)" autocomplete="off"
                    aria-autocomplete="list" aria-controls="slash-menu" aria-expanded="false"></textarea>
          <button class="stop" id="stop" type="button" title="Stop (Esc)" hidden>■</button>
          <button class="send" id="send" type="submit" aria-label="Send">↑</button>
        </form>
      </div>
    </footer>
  </main>
</div>
<div class="modal" id="picker" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="picker-title">
    <div class="modal-head"><h3 id="picker-title">New session</h3><button class="icon-btn ghost" id="picker-close" aria-label="Close">✕</button></div>
    <input class="modal-search" id="picker-search" type="search" placeholder="Search repos and folders" autocomplete="off" spellcheck="false">
    <div class="picker-list" id="picker-list"></div>
    <form class="add-folder" id="add-folder">
      <input id="add-path" type="text" placeholder="Or a folder path, e.g. ~/Documents/notes" autocomplete="off" spellcheck="false">
      <button class="chip-btn" type="submit">Use folder</button>
    </form>
  </div>
</div>
<script src="/static/orb.js?v=__BUILD__"></script>
<script src="/static/app.js?v=__BUILD__"></script>
</body>
</html>
